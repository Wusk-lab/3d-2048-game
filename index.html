<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D 2048</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Arial', sans-serif; user-select: none; }
        
        /* UI 覆盖层样式 */
        .ui-layer { position: absolute; pointer-events: none; color: white; z-index: 10; text-shadow: 1px 1px 2px black; }
        #score-board { top: 20px; left: 20px; font-size: 32px; font-weight: bold; color: #edc22e; }
        #controls-info {
            top: 80px; left: 20px; font-size: 14px;
            background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 8px; border: 1px solid #444; pointer-events: auto;
        }
        .key {
            display: inline-block; background: #333; border: 1px solid #666; border-radius: 4px;
            padding: 2px 6px; margin: 0 2px; font-family: monospace; font-weight: bold; color: #fff;
        }
        #btn-group { position: absolute; top: 20px; right: 20px; z-index: 10; display: flex; gap: 10px; }
        button {
            background: #333; color: white; border: 1px solid #666; padding: 8px 16px; font-size: 16px;
            cursor: pointer; border-radius: 5px; transition: background 0.2s;
        }
        button:hover { background: #555; }
        #game-over {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9); padding: 50px; border-radius: 15px; text-align: center;
            z-index: 20; border: 2px solid #edc22e;
        }
        #game-over h1 { margin: 0 0 20px 0; font-size: 48px; color: #edc22e; }
        #axis-helper {
            position: absolute; bottom: 10px; right: 10px; width: 120px; height: 120px; z-index: 100; pointer-events: none;
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- 引入 Tween.js 用于动画 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

<div id="score-board" class="ui-layer">分数: <span id="score">0</span></div>

<div id="btn-group">
    <button onclick="toggleGrid()">切换网格 (G)</button>
    <button onclick="resetGame()">重新开始 (R)</button>
</div>

<div id="controls-info" class="ui-layer">
    <strong>🎮 智能视角 (Smart):</strong><br>
    <span class="key">↑</span> <span class="key">↓</span> <span class="key">←</span> <span class="key">→</span> : 当前视角平面滑动<br>
    <span class="key">J</span> 按视线方向推入 / <span class="key">K</span> 按视线方向拉出
    <hr style="border-color: #555; opacity: 0.5;">
    <strong>📍 绝对轴 (Absolute):</strong><br>
    <span class="key">A</span> / <span class="key">D</span> : X轴<br>
    <span class="key">W</span> / <span class="key">S</span> : Y轴<br>
    <span class="key">Q</span> / <span class="key">E</span> : Z轴<br>
    <hr style="border-color: #555; opacity: 0.5;">
</div>

<div id="game-over">
    <h1>游戏结束!</h1>
    <p>最终得分: <span id="final-score"></span></p>
    <button onclick="resetGame()" style="font-size: 24px; padding: 10px 30px;">再来一局</button>
</div>

<div id="axis-helper"></div>

<script>
    // --- 1. 配置常量 ---
    const GRID_SIZE = 3;
    const CUBE_SIZE = 10;
    const GAP = 2;
    const OFFSET_STEP = CUBE_SIZE + GAP;
    const WORLD_OFFSET = (GRID_SIZE * OFFSET_STEP - GAP) / 2 - (CUBE_SIZE / 2); 
    const ANIMATION_DURATION = 150; // 移动动画时间 (毫秒)

    const COLORS = {
        0: 0x333333, 
        2: 0xeee4da, 4: 0xede0c8, 
        8: 0xf2b179, 16: 0xf59563,
        32: 0xf67c5f, 64: 0xf65e3b, 
        128: 0xedcf72, 256: 0xedcc61, 
        512: 0xedc850, 1024: 0xedc53f, 
        2048: 0xedc22e, 
        4096: 0x3c3a32, 8192: 0x3c3a32,
        16384: 0x2a2a28, 32768: 0x442266, 65536: 0x221144, 131072: 0x111111
    };

    let scene, camera, renderer, controls;
    let axisScene, axisCamera, axisRenderer;
    let grid = []; 
    let cubes = []; 
    let score = 0;
    let font = null;
    let gridHelperGroup = null;
    let isGridVisible = true;
    let isAnimating = false; 

    // --- 2. 初始化 ---
    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x181818);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(50, 40, 60); 

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.autoClear = false; 
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);
        const fillLight = new THREE.PointLight(0x88ccff, 0.3);
        fillLight.position.set(-50, 20, -50);
        scene.add(fillLight);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // --- 修改 1: 解除 360 度旋转限制 ---
        controls.minPolarAngle = 0;         // 允许垂直向上看到顶 (0度)
        controls.maxPolarAngle = Math.PI;   // 允许垂直向下看到底 (180度)
        controls.minAzimuthAngle = -Infinity; // 水平方向无限旋转
        controls.maxAzimuthAngle = Infinity;
        controls.enableRotate = true;
        controls.screenSpacePanning = false; 


        initAxisHelper();
        createGridData();
        createBoundingBox();
        createGridLines();

        const loader = new THREE.FontLoader();
        loader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', function (loadedFont) {
            font = loadedFont;
            resetGame();
        });

        window.addEventListener('resize', onWindowResize, false);
        window.addEventListener('keydown', onKeyDown, false);

        animate();
    }

    function initAxisHelper() {
        const container = document.getElementById('axis-helper');
        container.innerHTML = '';
        axisScene = new THREE.Scene();
        axisCamera = new THREE.PerspectiveCamera(50, 1, 1, 100);
        axisCamera.up = camera.up; 
        axisRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        axisRenderer.setSize(120, 120);
        axisRenderer.setClearColor(0x000000, 0); 
        container.appendChild(axisRenderer.domElement);
        const axesHelper = new THREE.AxesHelper(8);
        axisScene.add(axesHelper);
        const sphereGeo = new THREE.SphereGeometry(1.5, 16, 16);
        const addAxisEnd = (x, y, z, color, label) => {
            const mat = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(sphereGeo, mat);
            mesh.position.set(x, y, z);
            axisScene.add(mesh);
            createLabelSprite(label, x*1.5, y*1.5, z*1.5, color);
        };
        addAxisEnd(8, 0, 0, "#ff3333", "X");
        addAxisEnd(0, 8, 0, "#33ff33", "Y");
        addAxisEnd(0, 0, 8, "#3388ff", "Z");
    }

    function createLabelSprite(text, x, y, z, color) {
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.font = "bold 80px Arial";
        ctx.fillStyle = color;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, 64, 64);
        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({ map: texture, depthTest: false });
        const sprite = new THREE.Sprite(material);
        sprite.position.set(x, y, z);
        sprite.scale.set(6, 6, 1);
        axisScene.add(sprite);
    }

    function createGridData() {
        for(let x=0; x<GRID_SIZE; x++) {
            grid[x] = []; cubes[x] = [];
            for(let y=0; y<GRID_SIZE; y++) {
                grid[x][y] = []; cubes[x][y] = [];
                for(let z=0; z<GRID_SIZE; z++) {
                    grid[x][y][z] = 0; cubes[x][y][z] = null;
                }
            }
        }
    }

    function createBoundingBox() {
        const totalLen = GRID_SIZE * OFFSET_STEP;
        const geometry = new THREE.BoxGeometry(totalLen, totalLen, totalLen);
        const edges = new THREE.EdgesGeometry(geometry);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ 
            color: 0xaaaaaa 
        }));
        scene.add(line);
    }

    function createGridLines() {
        gridHelperGroup = new THREE.Group();
        const fullSize = GRID_SIZE * OFFSET_STEP;
        const halfSize = fullSize / 2;
        const material = new THREE.LineDashedMaterial({ 
            color: 0xffffff, // 原来是 0x444444
            dashSize: 1, 
            gapSize: 1, 
            opacity: 0.15,    // 建议透明度设低一点 (0.3左右)
            transparent: true 
        });
        function addLine(p1, p2) {
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1, p2]), material);
            line.computeLineDistances(); gridHelperGroup.add(line);
        }
        for (let i = 0; i <= GRID_SIZE; i++) {
            for (let j = 0; j <= GRID_SIZE; j++) {
                let p = i * OFFSET_STEP - halfSize; let q = j * OFFSET_STEP - halfSize;
                addLine(new THREE.Vector3(-halfSize, p, q), new THREE.Vector3(halfSize, p, q));
                addLine(new THREE.Vector3(p, -halfSize, q), new THREE.Vector3(p, halfSize, q));
                addLine(new THREE.Vector3(p, q, -halfSize), new THREE.Vector3(p, q, halfSize));
            }
        }
        scene.add(gridHelperGroup);
    }

    function toggleGrid() {
        isGridVisible = !isGridVisible;
        if(gridHelperGroup) gridHelperGroup.visible = isGridVisible;
    }

    function resetGame() {
        score = 0;
        updateScore();
        document.getElementById('game-over').style.display = 'none';
        TWEEN.removeAll(); 
        isAnimating = false;
        for(let x=0; x<GRID_SIZE; x++)
            for(let y=0; y<GRID_SIZE; y++)
                for(let z=0; z<GRID_SIZE; z++) {
                    grid[x][y][z] = 0;
                    if(cubes[x][y][z]) { scene.remove(cubes[x][y][z]); cubes[x][y][z] = null; }
                }
        addRandomTile();
        addRandomTile();
    }

    function updateScore() { document.getElementById('score').innerText = score; }

    function getPosition(x, y, z) {
        return {
            x: x * OFFSET_STEP - WORLD_OFFSET,
            y: y * OFFSET_STEP - WORLD_OFFSET,
            z: z * OFFSET_STEP - WORLD_OFFSET
        };
    }

    function createCube(x, y, z, value, isNew = false) {
        const pos = getPosition(x, y, z);
        const group = new THREE.Group();
        group.position.set(pos.x, pos.y, pos.z);

        const color = COLORS[value] || COLORS[131072];
        
        const geometry = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
        const material = new THREE.MeshPhysicalMaterial({
            color: color, transparent: true, opacity: 0.85, 
            transmission: 0.1, roughness: 0.2, metalness: 0.1, 
            clearcoat: 1.0, depthWrite: false 
        });
        const cubeMesh = new THREE.Mesh(geometry, material);
        cubeMesh.scale.set(0.95, 0.95, 0.95);
        group.add(cubeMesh);

        const edges = new THREE.EdgesGeometry(geometry);
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
        const edgeLines = new THREE.LineSegments(edges, lineMat);
        edgeLines.scale.set(0.95, 0.95, 0.95);
        group.add(edgeLines);

        if(font) {
            const textGeo = new THREE.TextGeometry(value.toString(), {
                font: font, size: value > 1000 ? CUBE_SIZE * 0.3 : CUBE_SIZE * 0.4, height: 0.5, curveSegments: 3
            });
            textGeo.computeBoundingBox();
            const centerOffset = - 0.5 * ( textGeo.boundingBox.max.x - textGeo.boundingBox.min.x );
            const centerY = - 0.5 * ( textGeo.boundingBox.max.y - textGeo.boundingBox.min.y );
            const centerZ = - 0.5 * ( textGeo.boundingBox.max.z - textGeo.boundingBox.min.z );
            textGeo.translate(centerOffset, centerY, centerZ);
            const textMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const textMesh = new THREE.Mesh(textGeo, textMat);
            textMesh.userData = { isBillboard: true };
            textMesh.renderOrder = 1; 
            group.add(textMesh);
        }

        if(isNew) {
            group.scale.set(0, 0, 0);
            new TWEEN.Tween(group.scale)
                .to({ x: 1, y: 1, z: 1 }, 200)
                .easing(TWEEN.Easing.Back.Out)
                .start();
        }

        scene.add(group);
        cubes[x][y][z] = group;
        return group;
    }

    function addRandomTile() {
        let empty = [];
        for(let x=0; x<GRID_SIZE; x++)
            for(let y=0; y<GRID_SIZE; y++)
                for(let z=0; z<GRID_SIZE; z++)
                    if(grid[x][y][z] === 0) empty.push({x,y,z});
        if(empty.length === 0) return;
        let c = empty[Math.floor(Math.random() * empty.length)];
        let val = Math.random() < 0.9 ? 2 : 4;
        grid[c.x][c.y][c.z] = val;
        createCube(c.x, c.y, c.z, val, true);
    }

    function slideCube(mesh, targetX, targetY, targetZ) {
        const targetPos = getPosition(targetX, targetY, targetZ);
        return new TWEEN.Tween(mesh.position)
            .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, ANIMATION_DURATION)
            .easing(TWEEN.Easing.Quadratic.InOut);
    }

    function popCube(x, y, z) {
        const mesh = cubes[x][y][z];
        if (!mesh) return;
        new TWEEN.Tween(mesh.scale)
            .to({ x: 1.2, y: 1.2, z: 1.2 }, 100)
            .easing(TWEEN.Easing.Quadratic.Out)
            .onComplete(() => {
                new TWEEN.Tween(mesh.scale)
                    .to({ x: 1, y: 1, z: 1 }, 100)
                    .easing(TWEEN.Easing.Quadratic.In)
                    .start();
            })
            .start();
    }

    function move(direction) {
        if(isAnimating) return; 

        let moved = false;
        let scoreGain = 0;
        let animations = []; 
        let toRemove = []; 
        let merges = [];
        let nextGrid = [];
        
        for(let x=0; x<GRID_SIZE; x++) {
            nextGrid[x] = [];
            for(let y=0; y<GRID_SIZE; y++) {
                nextGrid[x][y] = [];
                for(let z=0; z<GRID_SIZE; z++) {
                    nextGrid[x][y][z] = grid[x][y][z];
                }
            }
        }

        const processLine = (coords) => {
            let activeTiles = []; 
            for(let c of coords) {
                let val = grid[c.x][c.y][c.z];
                if(val !== 0) activeTiles.push({ val: val, pos: c });
            }

            let writeIdx = 0;
            for(let i=0; i<activeTiles.length; i++) {
                let current = activeTiles[i];
                let next = activeTiles[i+1];
                let targetPos = coords[writeIdx];

                if(next && current.val === next.val) {
                    let mergedVal = current.val * 2;
                    scoreGain += mergedVal;
                    animations.push({ mesh: cubes[current.pos.x][current.pos.y][current.pos.z], to: targetPos, type: 'merge_src' });
                    animations.push({ mesh: cubes[next.pos.x][next.pos.y][next.pos.z], to: targetPos, type: 'merge_dest' });
                    toRemove.push(cubes[current.pos.x][current.pos.y][current.pos.z]);
                    toRemove.push(cubes[next.pos.x][next.pos.y][next.pos.z]);
                    nextGrid[targetPos.x][targetPos.y][targetPos.z] = mergedVal;
                    merges.push({ x: targetPos.x, y: targetPos.y, z: targetPos.z, val: mergedVal });
                    writeIdx++;
                    i++; 
                    moved = true;
                } else {
                    if(current.pos.x !== targetPos.x || current.pos.y !== targetPos.y || current.pos.z !== targetPos.z) {
                        moved = true;
                        animations.push({ mesh: cubes[current.pos.x][current.pos.y][current.pos.z], to: targetPos, type: 'move' });
                    }
                    nextGrid[targetPos.x][targetPos.y][targetPos.z] = current.val;
                    writeIdx++;
                }
            }
            for(let i = writeIdx; i < GRID_SIZE; i++) {
                let c = coords[i];
                nextGrid[c.x][c.y][c.z] = 0;
            }
        };

        for(let a=0; a<GRID_SIZE; a++) {
            for(let b=0; b<GRID_SIZE; b++) {
                let lineCoords = [];
                for(let k=0; k<GRID_SIZE; k++) {
                    let c = {};
                    if(direction.startsWith('x')) { c.x=k; c.y=a; c.z=b; }
                    else if(direction.startsWith('y')) { c.x=a; c.y=k; c.z=b; }
                    else { c.x=a; c.y=b; c.z=k; }
                    lineCoords.push(c);
                }
                if(direction.endsWith('+')) lineCoords.reverse();
                processLine(lineCoords);
            }
        }

        if(!moved) return;

        isAnimating = true;
        let tweenCount = 0;
        const onAllFinished = () => {
            for(let x=0; x<GRID_SIZE; x++)
                for(let y=0; y<GRID_SIZE; y++)
                    for(let z=0; z<GRID_SIZE; z++) 
                        if(cubes[x][y][z]) { scene.remove(cubes[x][y][z]); cubes[x][y][z] = null; }
            
            grid = nextGrid;

            for(let x=0; x<GRID_SIZE; x++) {
                for(let y=0; y<GRID_SIZE; y++) {
                    for(let z=0; z<GRID_SIZE; z++) {
                        let val = grid[x][y][z];
                        if(val !== 0) {
                            createCube(x, y, z, val);
                        }
                    }
                }
            }
            merges.forEach(m => popCube(m.x, m.y, m.z));
            score += scoreGain;
            updateScore();
            addRandomTile();
            checkGameOver();
            isAnimating = false;
        };

        if(animations.length === 0) {
            onAllFinished();
            return;
        }

        animations.forEach(anim => {
            const t = slideCube(anim.mesh, anim.to.x, anim.to.y, anim.to.z);
            tweenCount++;
            if(tweenCount === animations.length) {
                t.onComplete(onAllFinished);
            }
            t.start();
        });
    }

    function checkGameOver() {
        for(let x=0; x<GRID_SIZE; x++)
            for(let y=0; y<GRID_SIZE; y++)
                for(let z=0; z<GRID_SIZE; z++)
                    if(grid[x][y][z] === 0) return;
        const check = (v1, v2) => v1 === v2;
        for(let x=0; x<GRID_SIZE; x++)
            for(let y=0; y<GRID_SIZE; y++)
                for(let z=0; z<GRID_SIZE; z++) {
                    let v = grid[x][y][z];
                    if(x<GRID_SIZE-1 && check(v, grid[x+1][y][z])) return;
                    if(y<GRID_SIZE-1 && check(v, grid[x][y+1][z])) return;
                    if(z<GRID_SIZE-1 && check(v, grid[x][y][z+1])) return;
                }
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over').style.display = 'block';
    }

    function onKeyDown(e) {
        if(document.getElementById('game-over').style.display === 'block') return;
        const key = e.key.toLowerCase();
        let inputVec = null;
        if (key === 'arrowup') inputVec = new THREE.Vector2(0, 1);
        else if (key === 'arrowdown') inputVec = new THREE.Vector2(0, -1);
        else if (key === 'arrowleft') inputVec = new THREE.Vector2(-1, 0);
        else if (key === 'arrowright') inputVec = new THREE.Vector2(1, 0);

        if (inputVec) {
            e.preventDefault();
            const moveDir = getSmartDirection(inputVec);
            if (moveDir) move(moveDir);
            return;
        }

        switch(key) {
            case 'a': move('x-'); break; 
            case 'd': move('x+'); break; 
            case 'w': move('y+'); break; 
            case 's': move('y-'); break; 
            case 'q': move('z-'); break; 
            case 'e': move('z+'); break; 
        }

        if (key === 'j') { move(getPushPullDirection('push')); return; }
        if (key === 'k') { move(getPushPullDirection('pull')); return; }
        if (key === 'g') toggleGrid();
        if (key === 'r') resetGame();
    }

    // --- 修改 2: 修正的智能视角判定逻辑 ---
    function getSmartDirection(inputVector2D) {
        camera.updateMatrixWorld();
        
        // 获取相机的右向量和上向量 (定义了屏幕平面)
        const camRight = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0).normalize();
        const camUp = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1).normalize();
        
        const directions = [
            { id: 'x+', vec: new THREE.Vector3(1, 0, 0) },
            { id: 'x-', vec: new THREE.Vector3(-1, 0, 0) },
            { id: 'y+', vec: new THREE.Vector3(0, 1, 0) },
            { id: 'y-', vec: new THREE.Vector3(0, -1, 0) },
            { id: 'z+', vec: new THREE.Vector3(0, 0, 1) },
            { id: 'z-', vec: new THREE.Vector3(0, 0, -1) }
        ];
        
        let bestDir = null;
        let bestScore = -Infinity;

        directions.forEach(d => {
            // 1. 将世界方向向量投影到屏幕坐标系 (Right, Up)
            const screenX = d.vec.dot(camRight);
            const screenY = d.vec.dot(camUp);
            const screenVec = new THREE.Vector2(screenX, screenY);
            
            // 关键点：这里不应该对 screenVec 进行 normalize()。
            // 向量的长度代表了该轴在屏幕上的“可见长度”。
            // 如果某个轴（比如从上往下看时的Y轴）几乎指向屏幕深处，它的投影长度接近0。
            // 如果我们不归一化，点积的结果会自动变小，从而自然过滤掉“推/拉”轴。

            // 2. 计算与输入向量的点积 (相似度 * 投影长度)
            const score = screenVec.dot(inputVector2D);

            if (score > bestScore) {
                bestScore = score;
                bestDir = d.id;
            }
        });
        
        return bestDir;
    }

    function getPushPullDirection(actionType) {
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir); dir.normalize();
        const absX = Math.abs(dir.x); const absY = Math.abs(dir.y); const absZ = Math.abs(dir.z);
        let majorAxis = 'z';
        if (absX > absY && absX > absZ) majorAxis = 'x';
        else if (absY > absX && absY > absZ) majorAxis = 'y';
        let sign = 0;
        if (majorAxis === 'x') sign = Math.sign(dir.x);
        if (majorAxis === 'y') sign = Math.sign(dir.y);
        if (majorAxis === 'z') sign = Math.sign(dir.z);
        if (actionType === 'pull') sign = -sign;
        return majorAxis + (sign > 0 ? '+' : '-');
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(time) {
        requestAnimationFrame(animate);
        TWEEN.update(time);
        controls.update();

        scene.traverse((obj) => {
            if(obj.userData.isBillboard) { obj.quaternion.copy(camera.quaternion); }
        });

        renderer.clear();
        renderer.render(scene, camera);

        axisCamera.position.copy(camera.position);
        axisCamera.position.sub(controls.target); 
        axisCamera.position.setLength(30); 
        axisCamera.lookAt(axisScene.position);
        axisRenderer.clear();
        axisRenderer.render(axisScene, axisCamera);
    }

    init();

</script>
</body>
